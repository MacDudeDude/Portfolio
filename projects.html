<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="Graphics/Misc/Favicon.ico" type="image/x-icon">

  <title>Alexander Blocker Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div id="nav-placeholder"></div>
    <div class="page-shell">

      <div>
        <header class="hero" style="margin-bottom: 2rem;">
          <h2>games I've made</h2>
        </header>
      </div>

        <div class="projects-controls" id="projects-controls" aria-label="Project sort controls"></div>
        <div class="projects-cards-list" id="projects-cards"></div>

    </div>

  <div id="foot-placeholder" style="position: sticky; bottom: 0;"></div>

  <script src="cursor.js"></script>
  <script src="nav-loader.js"></script>
